name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Descompactar projeto Android
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)
          echo "Arquivo encontrado: $ZIP"
          mkdir android-project
          unzip -q "$ZIP" -d android-project

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Gerar APK
        working-directory: android-project
        run: gradle :app:assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Story-Bridge-PRO-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
